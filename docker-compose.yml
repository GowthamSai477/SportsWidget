services:
  postgres:
    image: postgres:16-alpine
    container_name: widgets-postgres
    environment:
      POSTGRES_USER: widgets
      POSTGRES_PASSWORD: widgets_dev_pw
      POSTGRES_DB: widgets
    ports:
      - "5432:5432"
    volumes:
      # Named volumes live inside the Docker VM filesystem — Windows bind
      # mounts on the host drive caused Redis AOF write I/O errors (MISCONF)
      # and are not reliable for database storage on Docker Desktop.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widgets -d widgets"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: widgets-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
